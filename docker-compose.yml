version: "3.9"

services:
  backend:
    build:
      context: ./server
    container_name: restroom-backend
    ports:
      - "8787:8787"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: restroom-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped